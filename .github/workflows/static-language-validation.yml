name: Static language validation
on:
  push:
    branches: [fix/static-language-validation]
  pull_request:
    paths:
      - 'native-language-navigation.js'
      - 'build_static.py'
      - 'tests/static_language_navigation.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/static-language-validation.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-language-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            mobile: 'false'
          - engine: webkit
            mobile: 'false'
          - engine: webkit
            mobile: 'true'
    env:
      ENGINE: ${{ matrix.engine }}
      MOBILE: ${{ matrix.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps "${ENGINE}"
      - name: Build the exact static artifact
        run: |
          python build_static.py
          node --check _site/home.js
      - name: Test built language links
        if: github.event_name != 'workflow_run'
        run: timeout 150s python -u tests/static_language_navigation.py
      - name: Test published language links
        if: github.event_name == 'workflow_run'
        env:
          TEST_BASE_URL: https://eryaman-speaking-club.github.io/
        run: timeout 150s python -u tests/static_language_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-language-${{ matrix.engine }}-${{ matrix.mobile }}
          path: test-results
          retention-days: 7
